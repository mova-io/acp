# ACP CI — the gate between "committed" and "trusted".
#
# Mirrors azure-pipelines.yml step for step. That pipeline is not wired to this GitHub
# repo (only Netlify checks run on PRs here), which is how a collection-time
# ModuleNotFoundError in the backend suite went unnoticed. This workflow is the same
# gate on infrastructure that actually executes on every PR.
#
# "Step for step" is a live invariant, not a description: when azure-pipelines.yml gains a
# step, this gains it too, or the two gates disagree about what "trusted" means. It has
# already drifted once — the three matrix/backlog guards landed there while this ran without
# them, so a capability change could have gone green here and red there.
#
# azure-pipelines.yml is deliberately left in place, not deleted — mova-io/acp may still
# build from it, and removing it is a separate decision.
#
# Both engines, and why only one is BUILT here:
#   * Office (.NET) — vendored in engine/office-analysers/ since ADR 0012, so the CLI
#     builds standalone from a fresh clone. Built below; its test suites run.
#   * PDF — vendored in engine/pdf-analyser/ since ADR 0029, and needs no build step: it is
#     imported from the checkout (api/scanner.py's WP, env-overridable via ACP_PDF_ENGINE).
#
#     This comment used to say the PDF engine was "NOT vendored ... the suites needing it skip
#     with an honest reason", which was true when written and false since ADR 0029. That is the
#     costly direction for a stale comment to point: it told every reader that skipping was
#     expected, so a checkout that really had lost the engine would have looked normal.
#     tests/engines.py records being bitten by the identical stale claim once already, when
#     PDF_OK defaulted to a path outside the repo and ten tests skipped saying the engine "is
#     not vendored in this repo".
#
#     Neither engine is trusted to be present on the strength of a comment any more — the
#     "Fail if an analysis engine is missing" step at the end of this job asserts all three
#     (office, pdf, ocr) against the same availability checks the tests' own skips use.
#
# Ollama-backed tests self-skip here (ai.is_available() is false on a runner), so no
# model is needed and none is installed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Run it on demand, against any ref. Without this the gate is only ever reachable through an
  # event GitHub has to deliver, and on 2026-08-06 it stopped delivering them: a branch sat at
  # zero runs for half an hour across two pushes and a close/reopen, while a scheduled cron in
  # the same repo queued normally. There was no way to ask for the answer.
  #
  # It USED TO cover a gap the `concurrency` block below created: with a blanket
  # `cancel-in-progress: true`, several merges to main in quick succession cancelled each other's
  # runs (75d04de, 0e8f55d, 5e38f10 — none with a completed CI run on main), and a dispatch was the
  # only way to get the answer back. That is fixed at the source now — main gets one concurrency
  # group per commit, so no two runs on main can queue behind or cancel each other. The dispatch
  # stays for the OTHER reason above, which the fix does not address: when GitHub simply stops
  # delivering events.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a PR supersedes the in-flight run for that PR — on MAIN it must not.
  #
  # The group is keyed on the ref, so with a blanket `cancel-in-progress: true` several merges in
  # quick succession cancelled each OTHER'S runs on main. The comment above records that happening
  # (75d04de, 0e8f55d, 5e38f10 — none with a completed CI run). It costs more than a missing record:
  #
  #   deploy.yml fires on `workflow_run: [CI] completed` and its `if` requires that run to have
  #   concluded 'success'. A CANCELLED run is neither success nor failure, so the deploy is SKIPPED —
  #   and main's newest commit does not ship. 13 of the last 30 deploy runs were skipped this way,
  #   and on 2026-08-20 the tip sat undeployed for exactly this reason.
  #
  # It self-heals on the next merge (deploy.yml checks out CURRENT main, not the triggering sha),
  # which is precisely why it is easy to miss: the drift is real but transient, and the last commit
  # of the day is the one left behind.
  #
  # `cancel-in-progress: false` DID NOT FIX IT, and that is why the SHA is in the group below.
  # A concurrency group holds one RUNNING run plus one PENDING run. A third arrival cancels the
  # PENDING one whatever `cancel-in-progress` says — that flag governs the run already executing,
  # and a queued run is not it. So the middle commit of any three rapid merges still lost its CI
  # run, and still did not ship. Measured on 2026-09-06, twice inside ten minutes:
  #
  #   CI 3545 (#1621), pending behind 3544 — cancelled 20:56:11, as 3547 was created at 20:56:10
  #   CI 3549 (#1622), pending behind 3547 — cancelled 21:06:58, as 3550 was created at 21:06:56
  #
  # Each cancellation lands within two seconds of the next run's creation, and neither pending run
  # had a runner. deploy run 1330 then refused main's tip: "CI on b660a03 concluded 'cancelled',
  # not success — refusing to deploy it", leaving five merged PRs unshipped.
  #
  # So: supersede on a PR, and give main ONE GROUP PER COMMIT — nothing to queue behind, nothing to
  # cancel. This reverses the trade the previous fix chose. Runs on main are now parallel rather
  # than serial and cost more runner minutes; a commit that silently never deploys costs a confused
  # user comparing two builds, and serialising main turned out not to buy the safety it looked like.
  group: ci-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  # Vestigial for main now that its groups are per-commit, and still the correct answer there:
  # a group of one has nothing in progress to cancel. It governs PR refs, where it is load-bearing.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    # Sharded across free runners (matrix) — pytest-split gives each shard a subset, so the ~12-min
    # suite runs in parallel groups (~3-4 min wall). The WCAG-matrix + backlog guards run once, in
    # shard 1 only (they're not tests — they parse the repo). Public repo → free minutes, so this is
    # the larger-runner speedup without a paid org runner.
    name: Backend suite (shard ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The matrix guards below read commit bodies and diff against the target branch.
          # actions/checkout defaults to depth 1, which would make gen_progress_log.py --check
          # silently vacuous — it would find no commits to inspect and pass. Same reason
          # azure-pipelines.yml sets fetchDepth: 0.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            tests/requirements.txt

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache .NET (NuGet) packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('spike/dotnet/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build the Office analyser CLI
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
          DOTNET_NOLOGO: '1'
        run: dotnet build spike/dotnet/AcpScan.Cli/AcpScan.Cli.csproj -c Release --nologo
        # Lands the DLL at spike/dotnet/AcpScan.Cli/bin/Release/net10.0/AcpScan.Cli.dll —
        # the exact path tests/engines.py probes. bin/ stays gitignored: built, not committed.

      - name: Install tesseract (OCR)
        id: tesseract
        # The logic lives in scripts/install_tesseract.sh (tests/test_install_tesseract.py drives
        # every branch of it against a stub apt-get), because azure-pipelines.yml needs the same
        # treatment and a shell ladder buried in YAML cannot be tested.
        #
        # WHAT IT IS WORKING AROUND, measured rather than assumed. On 2026-08-19 this step failed
        # on roughly half of all runners for over an hour, and `-qq` on both halves of
        # `apt-get update && apt-get install` meant the log never said which one failed. The
        # timings did: every failure took 5m30s, with retry warnings 100s and 110s apart against
        # 10s/20s/30s backoff — so each attempt burned exactly the `timeout 90` on `apt-get
        # update`, and 3x90 + 60 = 330s = 5m30s. `apt-get install` never ran at all.
        #
        # So the script tries installing from the index ALREADY ON THE IMAGE first, with no
        # update: refreshing pulls Packages files for every configured source, while installing
        # tesseract-ocr pulls a few .debs, and a mirror too congested for the former usually
        # still serves the latter. Only if that fails does it pay for metadata, and only after
        # that does it try a different mirror.
        #
        # WHY THIS NO LONGER EXITS 1 HERE, and why that is NOT the job going soft on OCR.
        # On 2026-08-19 the mirror degraded mid-afternoon: at 15:29 three of four shards installed
        # tesseract in 1m50s-3m15s and one failed; by 15:49 all four failed. The job died at THIS
        # step, so `Install API + test dependencies` and the suite itself never ran — and a red
        # backend job that never executed a single test tells you nothing about the change under
        # review. Two PRs sat blocked with no signal at all.
        #
        # So the failure is RECORDED and the suite still runs; the job is failed at the end by
        # `Fail if OCR coverage was lost` below. The outcome is the same colour — red, always, no
        # exceptions — because the trailing comment on this step is right that silently dropping
        # 1.4.5/1.4.9 is exactly the shape of gap this repo has been bitten by twice. What changes
        # is that you now get "3074 passed, OCR skipped, failed because tesseract was unavailable"
        # instead of a dead job, so a real regression is still visible during an outage.
        continue-on-error: true
        run: bash scripts/install_tesseract.sh
        # Turns ON coverage rather than merely adding a dependency. ocr.is_available() gates
        # 1.4.5 / 1.4.9 (images of text) and every test that drives them self-skips without it —
        # so the OCR criteria were never exercised in CI at all, and the skips said so quietly
        # in a log nobody reads. That includes the corpus regression gate below, whose whole
        # value is asserting the WHOLE surface at once; a gate silently missing two criteria is
        # the shape of check this repo has been bitten by twice.
        #
        # ~3s to install, and OCR itself measured ~0.1s per image on a synthetic fixture.

      - name: Install API + test dependencies
        run: python -m pip install --quiet -r api/requirements.txt -r tests/requirements.txt
        # tests/requirements.txt carries the OOXML authoring libs (python-docx/pptx/openpyxl)
        # that ~12 test modules use to build fixtures on the fly. Without them the suite
        # aborts during collection, not merely at runtime.

      - name: Install veraPDF (PDF/UA-1 conformance gate)
        run: bash scripts/install_verapdf.sh
        # Turns ON the conformance check rather than merely adding a tool, exactly like the
        # tesseract step above. tests/verapdf.py degrades to a stated skip when veraPDF is
        # absent — right for a developer machine, and the wrong thing here: a skipped PDF/UA
        # check is a compliance claim nothing evaluated, which is the silent-skip shape
        # tests/test_undeclared_importorskip.py refuses for pip dependencies. veraPDF has no
        # wheel, so it gets a step instead of a requirements line.
        #
        # NOT continue-on-error, and that is the difference from the tesseract step: OCR
        # degrades to fewer criteria covered, while this gate is the only thing standing
        # between "we render an accessible PDF" and "we render a PDF". If it cannot install,
        # the honest outcome is a red job rather than a green one that skipped the check.

      - name: Install helm (packaging chart render gate)
        run: bash scripts/install_helm.sh
        # Same rule as veraPDF above, for the packaging chart. tests/test_packaging_chart.py
        # renders the chart for four platforms and compares the manifests — that comparison IS
        # ADR 0048's "one application package, per-cloud adapters" claim, and without helm every
        # one of those tests skips and the suite stays green with the chart unverified.
        #
        # test_ci_has_helm fails (rather than skipping) when CI is set and helm is missing, so
        # deleting this step turns one test red instead of quietly disarming twenty.

      - name: Backend suite (shard ${{ matrix.group }}/4)
        # --splits/--group (pytest-split) runs a quarter of the suite on this shard; -n auto +
        # loadfile parallelise within it. Cross-shard file splits are safe — each shard is its own
        # runner with its own checkout, so the fs-mutation race loadfile guards against (a test that
        # corrupts a generated file and restores it) can't span shards; within a shard, loadfile
        # still keeps a file's tests on one worker.
        #
        # -n auto: the suite is ~2,380 tests and was 77s of this job's 118s — the whole critical
        # path, since the two frontend jobs finish sooner and run in parallel. Measured 47.9s →
        # 15.5s locally.
        #
        # --dist loadfile is NOT a tuning knob, it is the correctness requirement, and without it
        # this is flaky rather than fast. tests/test_scope_presets_frontend_sync.py::
        # test_check_actually_fails_on_drift deliberately corrupts the real generated
        # scopePresets.js and restores it in a finally — which is the right test to have, because
        # a --check that cannot fail is indistinguishable from one that passed. Under plain -n
        # auto any worker reading that file during the window sees the corrupted copy, and three
        # tests fail with "a generated scopePresets.js is stale", naming the wrong cause.
        # loadfile keeps every test in a file on one worker, so the mutation and its readers are
        # serial with respect to each other. Verified: plain -n auto fails 3; with loadfile,
        # 2,381 pass.
        run: python -m pytest tests/ -q -n auto --dist loadfile --splits 4 --group ${{ matrix.group }} --junitxml=test-results-${{ matrix.group }}.xml

      # ── WCAG-matrix + backlog guards ──────────────────────────────────────────────
      # Mirrors azure-pipelines.yml. Each one exists because something drifted silently
      # first; a guard that only runs after a merge cannot stop the drift it detects, and
      # this workflow is the gate that actually executes on every PR here.

      - name: Matrix guard — capability ceiling still derivable
        if: ${{ matrix.group == 1 }}
        run: python scripts/gen_matrix_coverage.py --check
        # Every source a per-cell ceiling is derived from is parsed structurally. When one
        # moves, the generator raises rather than quietly producing a wrong ceiling.

      - name: Scaler guard — the queue scalers count claimable jobs
        if: ${{ matrix.group == 1 }}
        run: python scripts/gen_queue_scalers.py --check
        # Four KEDA scaler queries live in this tree and none of them is where the truth lives.
        # Until 2026-09-06 every one counted `status='queued'` while store.claim_job also
        # requires run_after <= now and attempts < max_attempts — so a job in retry backoff, or
        # one waiting for the reaper, asked for a replica no worker was allowed to use. On the
        # chart's oldest-job-age trigger that number has no ceiling and pins the tier at max.
        # api/queue_scaler.py owns the predicate; this holds the copies to it.

      - name: Backlog guard — docs/TODO.md coverage block is current
        if: ${{ matrix.group == 1 }}
        run: python scripts/gen_todo_status.py --check
        # docs/TODO.md carries generated coverage facts beside its authored backlog. They went
        # 387 commits stale because nothing checked them, and read as current the whole time.

      - name: Standards guard — the Section 508 catalog matches the regulation
        if: ${{ matrix.group == 1 }}
        run: python scripts/gen_section_508_catalog.py --check
        # config/section-508.json is the denominator of a 508-edition report: 120 requirements a
        # human must decide and that print in the exported tables. A row lost in a hand-edit is
        # invisible — the matrix renders, the report publishes, and the omission surfaces in a
        # customer's procurement review.
        #
        # The generator shipped WITH this --check in #1539 and nothing ever ran it, so the guard
        # existed and guarded nothing. Its own tests exercise check() in-process; that proves the
        # function works, not that anything invokes it on a change.
        #
        # Does NOT fetch eCFR — CI must not depend on it being up, and a regulation republished
        # upstream must not turn a green build red without a human looking. --check re-parses the
        # committed config/section-508-source.xml.

      - name: Corpus guard — ground-truth fixture coverage has not regressed
        if: ${{ matrix.group == 1 }}
        run: python scripts/gen_fixture_coverage.py --check
        # A RATCHET, not a threshold: fails on a DROP, not on falling short of 100%. Coverage is
        # 15 of 62 pairs today (.docx complete; xlsx/pptx/pdf have no labelled corpus at all), so
        # a guard demanding full coverage would be red on every commit — and a red that is always
        # red stops being read, which is exactly how the docs/TODO.md block above went 387 commits
        # stale. This one can merge today and still refuses to let a fixture quietly disappear.

      - name: Matrix guard — rule changes declare their matrix impact
        if: ${{ matrix.group == 1 }}
        run: |
          set -euo pipefail
          # On a PR the checkout is the merge commit, so origin/<base>..HEAD is the PR's own
          # commits PLUS GitHub's synthetic merge. check() skips that merge explicitly, by
          # parent count, so it is never asked for a trailer it could never carry.
          #
          # This comment used to say a merge "lists no files under --name-only", and the
          # implementation leaned on that. It is not true of merges — `git show` renders one as
          # a COMBINED diff, listing only what differs from EVERY parent, which is empty just
          # when the two sides touched disjoint files. #38 was the counter-example: base and
          # branch both edited api/remediate_pdf.py, the merge was flagged, and no commit
          # message could clear it. Fixed there; see #32.
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --quiet origin "$BASE_REF"
            python scripts/gen_progress_log.py --check --since "origin/$BASE_REF"
          else
            python scripts/gen_progress_log.py --check
          fi
        env:
          BASE_REF: ${{ github.base_ref }}
        # Fails when a commit changed rule code without declaring its matrix impact. Add a
        # `Matrix-Note:` (+ `WCAG:`) trailer, or `Matrix-Note: none` for a deliberate omission.
        # NOTE for whoever squashes a PR: the trailers live in the COMMIT MESSAGE, and a
        # rewritten squash body drops them. That happened on #12 and took #13 to repair.

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results-${{ matrix.group }}
          path: test-results-${{ matrix.group }}.xml
          if-no-files-found: warn

      - name: Fail if OCR coverage was lost
        # The other half of `Install tesseract (OCR)`'s continue-on-error. That step no longer
        # ends the job, so THIS one does — and it is deliberately the LAST step, after the suite
        # and all three guards have run.
        #
        # The job is red either way. That is the point, not a limitation: ocr.is_available()
        # gates 1.4.5 and 1.4.9, every test driving them self-skips without tesseract, and a
        # green tick over a suite silently missing two criteria is precisely what the install
        # step was added to prevent. Nothing here softens that.
        #
        # What moves is WHERE the job dies. Before, it died at the install and never ran a test,
        # so an apt outage produced a red job carrying zero information about the change under
        # review — on 2026-08-19 two PRs sat blocked exactly that way, with the mirror degrading
        # from one failing shard at 15:29 to all four at 15:49. Now the suite runs first: you get
        # the real pass/fail on everything that does not need OCR, and then this explains the red.
        #
        # `if: always()` so it also reports when the suite itself failed — otherwise a run with
        # both problems would show only the test failures and quietly regain the OCR gap.
        if: always() && steps.tesseract.outcome != 'success'
        run: |
          echo "::error::OCR (tesseract) was unavailable, so 1.4.5 and 1.4.9 were NOT exercised."
          echo "The suite above ran WITHOUT OCR coverage — read its result as partial."
          echo "This is an apt/mirror failure, not a defect in the change under review."
          exit 1

      - name: Fail if an analysis engine is missing
        # Generalises the OCR step above to all three engines, for the same reason and with the
        # same placement: last, `if: always()`, so the suite's real result is visible first and
        # this explains the red rather than replacing it.
        #
        # Kept ALONGSIDE the OCR step rather than replacing it, because the two answer different
        # questions and both are worth asking. That step reads `steps.tesseract.outcome`, so it
        # can attribute the failure to apt ("not a defect in the change under review") — which
        # this cannot know. This asks `ocr.is_available()`, the question the RUNTIME asks, so it
        # also catches an install that reported success while leaving no usable binary.
        #
        # Runs on every shard, not just group 1 like the matrix guards: engine availability is a
        # property of the runner, each shard IS a different runner, and a shard that lost an
        # engine ran partial coverage regardless of what the other three managed.
        if: always()
        run: python scripts/check_engines.py --require office,pdf,ocr

  postgres:
    # The lock-regression job. The backend shards run SQLite, so nothing there exercises the
    # behaviour that actually took production down on 2026-08-30: concurrent replica boots taking
    # ACCESS EXCLUSIVE on 40 tables while live readers hold ACCESS SHARE on the same tables in
    # opposite orders. SQLite has no such lock modes and no deadlock detector, so those tests can
    # only ever be written against a real server — and until this job existed they were written,
    # then skipped, which reports green while proving nothing.
    #
    # DISPOSABLE AND ISOLATED BY CONSTRUCTION: a service container created for this job and
    # destroyed with it, on the runner's own network, reachable only from these steps. It holds
    # nothing but the schema and whatever a test seeds. No production or staging database is
    # touched, and none of their credentials appear here.
    name: Postgres integration (schema/lock regressions)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: acp-ci-throwaway     # local to this container, never a real secret
          POSTGRES_DB: acp_ci
        ports:
          - 5432:5432
        # Without this the steps can start before the server accepts connections, and the job
        # fails on a connection error that looks exactly like a code failure.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # 3.12, because that is what the API image runs (deploy/public/Dockerfile.base-api). This
      # job sat on 3.11 with no stated reason while every other job, azure-pipelines.yml and
      # production were on 3.12 — testing the one version nothing ships. It stayed green only
      # because its test selection happens not to import routes/scans.py, which since #1592
      # contains a nested-quote f-string that is PEP 701 syntax and a SyntaxError before 3.12.
      # Adding a test here that imports the app would have turned it red for a reason that had
      # nothing to do with the test. tests/test_ci_python_version.py now holds the pins together.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API + test dependencies
        run: python -m pip install --quiet -r api/requirements.txt -r tests/requirements.txt

      - name: Schema, lock and job-queue regressions against a real PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:acp-ci-throwaway@localhost:5432/acp_ci
          # Turns a missing DATABASE_URL into a FAILURE instead of a skip — see
          # test_the_postgres_tests_are_not_silently_skipped. A misconfigured integration job
          # that quietly skips is the failure mode this whole job exists to avoid.
          ACP_REQUIRE_PG: '1'
          # Consent to the destructive fixtures (TRUNCATE of every table; DROP of the migration
          # marker). conftest.require_disposable_postgres refuses to run them without it, and
          # additionally requires a loopback host and a disposable database name — both of which
          # the service container above satisfies (localhost / acp_ci). Setting this anywhere
          # that is not a throwaway is the mistake the guard exists to prevent.
          ACP_PG_TEST_DESTRUCTIVE: '1'
        run: |
          python -m pytest tests/test_schema_boot_locks.py tests/test_pg_job_queue.py \
            tests/test_pg_result_fencing.py tests/test_db_mutation_reserve.py \
            tests/test_ai_spending_budget.py \
            tests/test_document_wide_chunk_store.py \
            tests/test_pg_hitl_idempotency.py tests/test_pg_pool_growth.py tests/test_pg_scheduled_execution.py tests/test_pg_schema_preflight.py \
            -v --no-header -p no:warnings

      - name: Fail if anything in this job skipped instead of running
        env:
          DATABASE_URL: postgresql://postgres:acp-ci-throwaway@localhost:5432/acp_ci
          ACP_REQUIRE_PG: '1'
          ACP_PG_TEST_DESTRUCTIVE: '1'
        # `pytest` exits 0 on a skip, so neither the exit status above nor a green tick here
        # distinguishes "the Postgres behaviour is correct" from "it was never tested".
        #
        # ASSERT ZERO SKIPS rather than a specific passed-count. The previous version grepped for
        # `^2 passed` after selecting the two real-server tests by name — correct at the time and
        # already wrong by the next commit that adds a test, which is the failure mode of pinning
        # a number. Every test in these files is gated on DATABASE_URL alone, so in THIS job the
        # honest invariant is that nothing skips at all, and it keeps holding as tests are added.
        run: |
          set -euo pipefail
          python -m pytest tests/test_schema_boot_locks.py tests/test_pg_job_queue.py \
            tests/test_pg_result_fencing.py tests/test_pg_hitl_idempotency.py tests/test_pg_pool_growth.py tests/test_pg_scheduled_execution.py tests/test_pg_schema_preflight.py \
            tests/test_ai_spending_budget.py \
            tests/test_document_wide_chunk_store.py \
            -q --no-header -p no:warnings > /tmp/pg.txt 2>&1 || { cat /tmp/pg.txt; exit 1; }
          cat /tmp/pg.txt
          if grep -qE '[0-9]+ skipped' /tmp/pg.txt; then
            echo "::error::tests skipped in the Postgres job — they did not exercise the server"
            exit 1
          fi
          grep -qE '[0-9]+ passed' /tmp/pg.txt || {
            echo "::error::no tests ran in the Postgres job"; exit 1; }

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # pdfjs-dist requires >=22.13
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm 11
        run: npm install -g npm@11 --no-audit --no-fund
        # The lockfile is npm-11 authored; npm 10 rejects its nested entries.

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Frontend unit tests (rule round-trips + WCAG coverage contract)
        run: npx vitest run
        working-directory: frontend

      - name: Frontend build
        run: npx vite build
        working-directory: frontend

  e2e:
    name: Playwright E2E (browser + local API)
    runs-on: ubuntu-latest
    # Soft launch. `deploy.yml` fires on `workflow_run: [CI] completed` and requires
    # conclusion success, so a job added here sits on the deploy critical path — a flaky
    # browser run would block deploys, not just fail a PR. Drop this once the suite has a
    # track record; until then a red E2E is a signal to read, not a gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'          # pdfjs-dist requires >=22.13
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm 11
        run: npm install -g npm@11 --no-audit --no-fund
        # The lockfile is npm-11 authored; npm 10 rejects its nested entries.

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend

      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The venv path scripts/e2e-api.sh looks for by default. Only the API's own deps —
      # no .NET Office CLI, because the e2e corpus is PDF, whose analyser is pure Python
      # and vendored in-repo (ADR 0029).
      - name: Install API dependencies
        run: |
          python -m venv .venv-e2e
          .venv-e2e/bin/pip install --quiet -r api/requirements.txt

      # Playwright's webServer config starts both the API (scripts/e2e-api.sh) and vite,
      # with VITE_SIM=false so the browser drives the real backend rather than sim.js.
      - name: Playwright E2E
        run: npx playwright test
        working-directory: frontend

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
