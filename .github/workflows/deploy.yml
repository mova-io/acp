# Chain B, automated. See docs/pipeline.md.
#
# Until now every image in the registry was built from a laptop — `runType: QuickRun`,
# `sourceTrigger: null`, no exceptions. docs/pipeline.md said so plainly: "Chain B is a person at
# a laptop. There is no pipeline." That was not a preference; it was a consequence. The Dockerfile
# copied the PDF engine from a gitignored staging directory that a script filled from a checkout
# OUTSIDE the repo, so a CI checkout could never assemble a complete build context. ADR 0029
# vendored the engine, which is what makes this file possible at all.
#
# This job runs deploy/public/redeploy.sh rather than reimplementing it. That matters: the script's
# guards are scar tissue, each added because it failed on 2026-07-29 — the pin, the isolated clone,
# the >=41 module check, health-before, and the refusal to finish on an unstamped image. Copying
# eight steps into YAML would have forked them, and the copy would have rotted first.
name: deploy

on:
  # MANUAL BY DEFAULT. `workflow_dispatch` is always allowed and is how production ships. The
  # `workflow_run` trigger below still exists, but its job is SKIPPED unless the repository
  # variable PRODUCTION_AUTO_DEPLOY_ENABLED is '1' — see the job's `if`. It is unset, so no merge
  # to `main` deploys on its own.
  #
  # The gate is a variable rather than Settings -> Actions -> deploy -> Disable workflow because
  # A DISABLED WORKFLOW CANNOT BE DISPATCHED EITHER: switching the automatic trigger off that way
  # also removes the manual button, and re-enabling it to ship one thing re-arms the automatic
  # trigger in the same click. Leave the workflow ENABLED and the variable UNSET.
  #
  # AND WHEN IT IS OPTED IN, IT IS STILL AFTER CI — NOT ON PUSH. The first cut of this triggered
  # on `push: [main]`, which
  # raced the commit's own CI: a merge fires deploy.yml and ci.yml at the same instant, and
  # redeploy.sh's gate REFUSES to ship a commit whose CI has not passed. So every push-triggered
  # deploy died at "no CI run found for <sha>" before touching anything (PR #221 shipped exactly
  # that, and it failed on the merge that enabled it — the app was never at risk, the gate held).
  #
  # workflow_run fires this AFTER the CI workflow completes on main, so the gate always sees a
  # finished run; the job's `if` below additionally requires that run to have SUCCEEDED, so a red
  # CI never deploys. `branches: [main]` keeps PR CI completions (head branch = the PR's) from
  # triggering it — only a CI run whose branch is main, i.e. a merge, does.
  #
  # Safety is still the `production` GitHub Environment gate, not the trigger: with required
  # reviewers each auto-run waits for an approval; without them it deploys unattended, a choice to
  # make with eyes open. Use the manual dispatch below to pin a sha or run blue-green.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pin:
        # Any commit-ish: a full or ABBREVIATED sha, a branch, or a tag. It is resolved to a full
        # sha below before anything consumes it — see "Resolve the pinned ref".
        description: "Commit to deploy — sha (short ok), branch or tag (default: current main)"
        required: false
        type: string
      blue_green:
        description: "Blue-green: provision at 0% traffic, smoke-test, then promote"
        required: false
        default: false
        type: boolean
      deploy_with_active_jobs:
        description: "Emergency only: replace workers even when queued/running jobs exist"
        required: false
        default: false
        type: boolean
      skip_ci_gate:
        description: "Bypass redeploy.sh's CI-conclusion gate (ACP_SKIP_CI_GATE=1) — for a manual dispatch when CI is red on a known-unrelated flake, not routine use"
        required: false
        type: boolean
        default: false

concurrency:
  # Two deploys at once would race on the CalVer ordinal and could leave acp-app and acp-worker on
  # different images — the split the script exists to prevent. Never cancel a running one: it may
  # already have shifted traffic, and a half-finished deploy is worse than a queued one.
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write      # OIDC federation to Azure — no stored client secret
  contents: read
  actions: read        # the script's CI gate reads this commit's CI conclusion

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Gate whether this deploy FIRES. A manual dispatch is always allowed (the operator chose it).
    # An AUTOMATIC run needs two things: the CI workflow that triggered it must have concluded
    # 'success' (workflow_run fires on 'completed' regardless, so a red merge must not queue a
    # deploy), AND PRODUCTION_AUTO_DEPLOY_ENABLED must be '1'. Unset — the default — is not '1',
    # so the automatic path is inert and this workflow is manual-only.
    #
    # '1' rather than a true/false spelling on purpose. GitHub's `==` compares strings
    # CASE-INSENSITIVELY, so a 'true' gate would also accept 'TRUE' and 'True'; a digit has no
    # case to argue about and no near-miss that silently arms production. Arm it at Settings ->
    # Secrets and variables -> Actions -> Variables; delete the variable to disarm. Repository-
    # scoped, because an environment-scoped variable is not resolvable in a job `if`.
    #
    # This no longer decides what SHIPS. The steps below deploy main's live tip at approval time,
    # not this triggering commit, so the guarantee that the shipped commit is green comes from
    # redeploy.sh's own CI gate on that tip — not from this `if`. Kept because firing a deploy off a
    # red triggering run is pure noise: it would only reach the script's gate and be refused.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       vars.PRODUCTION_AUTO_DEPLOY_ENABLED == '1')
    # A GitHub Environment with required reviewers is the approval gate. Configure it at
    # Settings -> Environments -> production. Without reviewers this deploys unattended once CI is
    # green, which is a deliberate choice, not the trigger's doing.
    environment:
      name: production
      url: https://${{ vars.ACP_FQDN }}
    steps:
      # actions/checkout takes `ref` VERBATIM — a branch, a tag, or a FULL 40-char sha. An
      # abbreviated sha is none of those, so `pin: e2ac2ab` dies in checkout with a git error
      # naming the ref and nothing about why it was refused, before a single line of deploy logic
      # runs. Observed 2026-08-20 on a manual pinned deploy.
      #
      # This is the SAME defect redeploy.sh fixed on 2026-07-30, one layer up. That script already
      # resolves ACP_PIN itself ("RESOLVE whatever was asked for into a full 40-char sha"), and its
      # comment records the identical failure: a short pin "sailed past this line and died at the
      # CI gate", naming the wrong cause and inviting ACP_SKIP_CI_GATE=1 as the remedy. The fix was
      # correct and it did not travel — this job later added a SECOND consumer of the same raw
      # input, upstream of the normalisation, and re-opened the bug in front of it.
      #
      # So resolve ONCE, here, and let both consumers read the resolved value. Done over the API
      # rather than with git because there is no checkout yet — that is the whole problem.
      - name: Resolve the pinned ref
        id: pin
        if: inputs.pin != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PIN: ${{ inputs.pin }}
        run: |
          set -euo pipefail
          # `commits/{ref}` accepts a short sha, a branch or a tag and answers with the full sha.
          SHA="$(gh api "repos/${{ github.repository }}/commits/$PIN" --jq .sha || true)"
          # Checked against the shape checkout needs, not merely against emptiness: `gh api` can
          # answer 200 with something that is not a sha, and the whole point is that the value
          # reaching `ref:` is one. Fail HERE, where the message can name the input and what it
          # accepts, instead of in the checkout error this step exists to prevent.
          if ! printf '%s' "$SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::cannot resolve pin '$PIN' to a commit in ${{ github.repository }} — expected a sha (short is fine), a branch, or a tag"
            exit 1
          fi
          echo "pin '$PIN' resolved to $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # redeploy.sh pins a sha and clones locally from this checkout
          # Check out CURRENT main, not the sha that triggered this run. The trigger sha is frozen
          # when workflow_run fires, but this job may sit for hours behind the production
          # environment's approval gate — approving it would then ship a stale commit while newer
          # ones wait unshipped (the exact drift the monitor's deploy-drift check exists to catch).
          # A branch ref resolves at checkout time, i.e. AFTER approval, to main's live tip. A
          # manual dispatch pins its own sha (or main). See ACP_PIN below and redeploy.sh's gate,
          # which refuses to ship whatever this resolves to unless its CI is green.
          # The RESOLVED sha, never the raw input. Empty when unpinned — the step above is
          # skipped — so this falls through to 'main', which is the point of the comment above.
          ref: ${{ steps.pin.outputs.sha || 'main' }}

      # The Office analyser is built from source on every deploy; the image copies the DLLs.
      # setup-dotnet puts the muxer on PATH, which is why redeploy.sh resolves dotnet via PATH
      # rather than the ~/.dotnet path a dev machine has.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL scaler parser
        run: python3 -m pip install 'psycopg2-binary>=2.9,<3'

      - name: Deploy
        env:
          # gh is preinstalled on GitHub runners; this is what lets the script's CI gate actually
          # check rather than skip.
          GH_TOKEN: ${{ github.token }}
          ACP_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ACP_STARTUP_EVIDENCE_PATH: ${{ runner.temp }}/acp-startup-evidence.json
          # Empty on an auto (workflow_run) deploy, so redeploy.sh resolves ACP_PIN:-origin/main —
          # main's tip at the moment this runs (after any approval wait), re-fetched by the script.
          # A manual dispatch may still pin an explicit sha. The script's CI gate then refuses to
          # ship the resolved commit unless CI is green on it, so pinning the live tip fails CLOSED
          # (a refusal to wait for CI) rather than open (shipping a stale but known-green sha).
          # The resolved sha, so the script and the checkout above cannot pin different commits.
          # redeploy.sh resolves again and that is fine — resolving a full sha is a no-op.
          ACP_PIN: ${{ steps.pin.outputs.sha }}
          ACP_DEPLOY_TARGET_ENV: production
          # A production environment/repository variable, absent by default. The deploy script
          # accepts only 0/1 and independently validates the fleet and resource ceilings.
          ACP_CAPACITY_APPLY_ENABLED: ${{ vars.PRODUCTION_CAPACITY_APPLY_ENABLED || '0' }}
          ACP_ACA_VCPU_QUOTA: ${{ vars.PRODUCTION_ACA_VCPU_QUOTA }}
          ACP_PG_MAX_CONNECTIONS: ${{ vars.PRODUCTION_PG_MAX_CONNECTIONS }}
          ACP_PG_RESERVED_CONNECTIONS: ${{ vars.PRODUCTION_PG_RESERVED_CONNECTIONS }}
          ACP_RELEASE_WORKER: ${{ vars.PRODUCTION_RELEASE_WORKER }}
          ACP_BLUE_GREEN: ${{ inputs.blue_green && '1' || '0' }}
          ACP_DEPLOY_WITH_ACTIVE_JOBS: ${{ inputs.deploy_with_active_jobs && '1' || '0' }}
          # Only reachable via an explicit manual dispatch with the checkbox set — `inputs` is
          # empty on the auto (workflow_run) trigger, so this is unset there and the gate behaves
          # exactly as before. See the input's own description for when this is legitimate.
          ACP_SKIP_CI_GATE: ${{ inputs.skip_ci_gate && '1' || '' }}
        run: bash deploy/public/redeploy.sh

      - name: Retain sanitized startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-startup-evidence
          path: ${{ runner.temp }}/acp-startup-evidence.json
          if-no-files-found: ignore

      # Independent of the script's own verification, and deliberately so: the script asserts the
      # deploy it just performed, which is the party with an interest in it having worked.
      - name: Confirm the live app reports the new build
        run: |
          set -euo pipefail
          FQDN="${{ vars.ACP_FQDN }}"
          H="$(curl -fsS --max-time 20 "https://$FQDN/healthz")"
          R="$(curl -fsS --max-time 20 "https://$FQDN/readyz")"
          # The route ACA's readiness probe gates ingress on (shared by both deploy scripts).
          # Checked here for a reason the other two do not cover: the probe lives on the
          # container app's TEMPLATE and survives an image change, so an image that does not
          # serve this route would leave the gate asking for a 404 and the revision would never
          # become ready. curl -f already fails on the 503 this answers when it is not ready.
          P="$(curl -fsS --max-time 20 "https://$FQDN/probe/readyz")"
          echo "healthz:      $H"
          echo "readyz:       $R"
          echo "probe/readyz: $P"
          case "$H" in *'"version_stamped":true'*) ;; *) echo "::error::live app is not version-stamped"; exit 1 ;; esac
          case "$R" in *'"ready":true'*)           ;; *) echo "::error::live app is not ready";          exit 1 ;; esac
          case "$P" in *'"ready":true'*)           ;; *) echo "::error::the route ACA gates ingress on is not ready"; exit 1 ;; esac
